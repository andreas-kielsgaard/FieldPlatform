services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: field_platform
      POSTGRES_PASSWORD: field_platform
      POSTGRES_DB: field_platform
    volumes:
      - field-platform-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field_platform -d field_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  field-platform-postgres:
